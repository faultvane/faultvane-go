name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Core benchmarks on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Show the machine
        run: lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core' && free -h
      - name: Run the benchmarks
        run: go test -run '^$' -bench . -benchmem -count 5 ./... | tee benchmarks.txt
      - name: Keep the results
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-linux
          path: benchmarks.txt
