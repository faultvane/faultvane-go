name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go: ["1.24", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Verify modules
        run: go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with coverage minimum
        run: sh scripts/coverage.sh
      - name: Check requirement traceability
        run: sh scripts/traceability.sh
      - name: Test the tools
        working-directory: tools
        run: go vet ./... && go test -count=1 ./...

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module: [".", "store/redis", "store/sql", "store/mongodb", "otel", "examples", "scenarios", "tools"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}

  stores:
    name: Store adapters and integrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test each adapter against a real store
        env:
          KEEP_STORES: "1"
        run: sh scripts/test-stores.sh
      - name: Test the OpenTelemetry module
        working-directory: otel
        run: sh ../scripts/coverage.sh
      - name: Build and run the examples
        working-directory: examples
        run: go vet ./... && go test -count=1 ./...
