name: Fuzz

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./circuitbreaker
            target: FuzzMachine
          - package: ./circuitbreaker
            target: FuzzValidName
          - package: ./timeout
            target: FuzzNew
          - package: ./retry
            target: FuzzBackoffCeiling
          - package: ./retry
            target: FuzzBudgetRatio
          - package: ./ratelimit
            target: FuzzBucket
          - package: ./loadshed
            target: FuzzShedder
          - package: ./concurrencylimit
            target: FuzzLimit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Fuzz
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 3m ${{ matrix.package }}
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target }}
          path: "**/testdata/fuzz"
