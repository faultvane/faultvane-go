<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Faultvane: a resilience toolkit for Go. Seven policies that keep a service stable when a dependency fails.">
  <title>Faultvane: a resilience toolkit for Go. Seven policies that keep a service stable when a dependency fails.</title>
