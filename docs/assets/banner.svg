  <text x="82" y="205" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#D6E0EC">A resilience toolkit for Go.</text>
  <text x="82" y="243" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="27" font-weight="400" fill="#D6E0EC">Stay stable <tspan font-weight="700" fill="#FFB020">when a dependency fails</tspan>.</text>
