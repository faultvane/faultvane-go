services:
  redis:
    image: redis:7-alpine
    ports:
      - "6399:6379"
  redis-cluster:
    image: redis:7-alpine
    command: ["redis-server", "--cluster-enabled", "yes"]
    ports:
      - "6398:6379"
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: faultvane
      POSTGRES_DB: faultvane
    ports:
      - "5499:5432"
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: faultvane
      MYSQL_DATABASE: faultvane
    ports:
      - "3399:3306"
  mongodb:
    image: mongo:7
    ports:
      - "27099:27017"
